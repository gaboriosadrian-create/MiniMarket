<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    
    <title>MiniMarket</title>
    <meta name="description" content="Sistema de Punto de Venta y Gestión para MiniMarket" />
    <meta name="application-name" content="MiniMarket" />
    
    <!-- PWA & Mobile Web Capabilities -->
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MiniMarket" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Icons & Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/icons/icon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- Splash Screen Styles for Instant Standalone Startup -->
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #059669;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      #mm-initial-splash {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background-color: #059669;
        color: #ffffff;
        text-align: center;
        user-select: none;
        -webkit-user-select: none;
      }
      .mm-splash-logo-box {
        width: 76px;
        height: 76px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 16px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
        animation: mmLogoPulse 2.4s ease-in-out infinite;
      }
      .mm-splash-title {
        font-size: 24px;
        font-weight: 900;
        letter-spacing: -0.025em;
        margin: 0 0 6px 0;
        color: #ffffff;
      }
      .mm-splash-subtitle {
        font-size: 14px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.95);
        margin: 0 0 4px 0;
      }
      .mm-splash-hint {
        font-size: 12px;
        font-weight: 500;
        color: rgba(209, 250, 229, 0.8);
        margin: 0;
      }
      @keyframes mmLogoPulse {
        0%, 100% {
          transform: scale(0.95);
          opacity: 0.92;
        }
        50% {
          transform: scale(1.03);
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .mm-splash-logo-box {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant Startup Static Splash (Replaced by React on mount) -->
      <div id="mm-initial-splash">
        <div class="mm-splash-logo-box">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7" />
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" />
            <path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4" />
            <path d="M2 7h20" />
            <path d="M22 7v3a2 2 0 0 1-2 2v0a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12v0a2 2 0 0 1-2-2V7" />
          </svg>
        </div>
        <h1 class="mm-splash-title">MiniMarket</h1>
        <p class="mm-splash-subtitle">Cargando MiniMarket...</p>
        <p class="mm-splash-hint">Iniciando aplicación</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
